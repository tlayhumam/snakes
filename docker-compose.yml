services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: snakes
      MYSQL_USER: snakes
      MYSQL_PASSWORD: snakes
      MYSQL_ROOT_PASSWORD: local-root-only
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--transaction-isolation=READ-COMMITTED"]
    ports:
      - "3307:3306"
    volumes:
      - snakes_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal-root-only"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: mysql+asyncmy://snakes:snakes@mysql:3306/snakes?charset=utf8mb4
      FRONTEND_ORIGIN: http://localhost:5173
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  snakes_mysql:
